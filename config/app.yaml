# Configuration de la passerelle EcoShield.
#
# Tout ce qui dépend du déploiement est interpolé depuis l'environnement, pour
# que la même image serve en local et en production sans réécriture.
waffle:
  env: '%env(APP_ENV)%'
  debug: false

  # Le middleware TrustedHost rejette tout Host non listé : une passerelle est
  # exposée par construction, et un Host forgé est le vecteur classique
  # d'empoisonnement de cache et de redirection.
  trusted_hosts:
    - localhost
    - 127.0.0.1
    - gateway

  # Niveau 1 : la passerelle ne porte pas d'ABAC (voir AnonymousSecurityContext).
  # Les contrôleurs déclarent #[PublicAccess] explicitement.
  security:
    level: 1

  paths:
    controllers: 'src/Controller'

  cache:
    # 'array' (par worker), 'file' (partagé par volume) ou 'redis' (partagé par
    # tous les workers ET toutes les instances — le seul choix correct dès qu'il
    # y a plus d'un réplica, puisqu'un cache par worker multiplie les appels au
    # legacy par le nombre de workers).
    adapter: '%env(CACHE_ADAPTER)%'
    dsn: '%env(REDIS_DSN)%'

  # Base de données des routes reprises (RFC-022).
  #
  # Entièrement optionnelle : le pool est paresseux, et sans `DB_HOST` aucune
  # connexion n'est jamais ouverte — la passerelle démarre et sert le proxy et le
  # Shield exactement comme avant. Seule la route de lecture reprise répond alors
  # 503, ce qui est la réponse honnête d'une reprise privée de sa source.
  database:
    driver: '%env(DB_DRIVER)%'
    host: '%env(DB_HOST)%'
    port: '%env(DB_PORT)%'
    database: '%env(DB_NAME)%'
    username: '%env(DB_USER)%'
    password: '%env(DB_PASSWORD)%'
    # Connexions par WORKER, pas par instance : chaque worker porte son propre
    # pool. Le total ouvert vaut donc WORKER_COUNT x pool_size, et c'est ce
    # produit qu'il faut confronter au `max_connections` du serveur.
    pool_size: '%env(DB_POOL_SIZE)%'

  # Client vers le monolithe (NET-02/03, RFC-024), avec les clés du squelette du
  # framework. Une clé absente prend la valeur par défaut du contrat.
  http_client:
    # Délais de chaque transfert, jamais infinis : 1 à 30000 ms pour la
    # connexion, 1 à 120000 ms au total — une réponse plus longue à transférer
    # que `total_timeout_ms` est coupée. Reprises des seules méthodes
    # idempotentes (GET, HEAD, OPTIONS, PUT, DELETE), sur échec réseau ou
    # 429/502/503/504, avec un recul exponentiel à gigue complète plafonné à
    # `max_delay_ms`. Aucune attente ne démarre au-delà de `budget_ms` : le pire
    # cas vaut ce budget plus un transfert complet (RFC-024 §3.3), 25 s ici.
    # `max_attempts: 1` coupe les reprises. La passerelle ne rejoue jamais un
    # POST ni un PATCH : `retry_non_idempotent` n'est pas lue.
    resilience:
      connect_timeout_ms: 1000
      total_timeout_ms: 10000
      max_attempts: 3
      base_delay_ms: 100
      max_delay_ms: 2000
      budget_ms: 15000
    # Disjoncteur de l'amont, état partagé dans Redis par tous les workers et
    # toutes les instances : il s'ouvre quand `failure_rate_percent` % des appels
    # échouent (réseau ou 5xx) sur `window_seconds`, à partir de `minimum_calls`
    # appels. Ouvert, la passerelle répond 503 sans appeler le monolithe ; après
    # `cool_down_seconds`, `half_open_trials` appel(s) d'essai, et un succès le
    # referme. Redis indisponible : il laisse passer, avec un avertissement.
    breaker:
      enabled: true
      failure_rate_percent: 50
      minimum_calls: 10
      window_seconds: 60
      cool_down_seconds: 30
      half_open_trials: 1
      redis_dsn: '%env(REDIS_DSN)%'

gateway:
  # Le monolithe legacy à protéger. Fixé par l'exploitant, jamais par le client.
  upstream: '%env(UPSTREAM_URL)%'

  # Ouvre `/__ecoshield/memory`, qui publie le tas du worker. Non défini = fermé :
  # l'empreinte mémoire d'une passerelle exposée renseigne un attaquant sur
  # l'effet de ses requêtes. Seul le banc (docker-compose.perf.yml) l'ouvre.
  diagnostics: '%env(ECOSHIELD_DIAGNOSTICS)%'

  shield:
    # Durée de vie d'une réponse mise en cache, en secondes.
    ttl: 30
    # Au-delà, la réponse traverse en flux et n'est pas mise en cache : la
    # garantie de mémoire constante prime sur le taux de hit.
    max_body_bytes: 262144
