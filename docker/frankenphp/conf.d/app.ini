; Réglages PHP de la passerelle.
;
; La mémoire est le sujet du projet : la limite est donc basse par conception.
; Un proxy qui streame n'a aucune raison d'accumuler — si cette limite est
; atteinte, c'est qu'un corps est bufferisé quelque part, et c'est un bug à
; corriger, pas une valeur à augmenter.
memory_limit = 128M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
