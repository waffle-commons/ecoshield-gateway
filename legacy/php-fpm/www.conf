; Pool PHP-FPM du monolithe.
;
; La configuration par défaut de l'image (pm=dynamic, max_children=5) rendait la
; comparaison inexploitable dans LES DEUX SENS : elle plafonnait la mémoire du
; legacy à cinq processus — flattant son empreinte — tout en le saturant à cinq
; requêtes concurrentes, ce qui gonflait sa latence. On mesurait une file
; d'attente, pas une architecture.
;
; `pm = ondemand` avec un plafond large est le réglage honnête : les enfants
; naissent quand la charge les demande et meurent ensuite, donc la mémoire SUIT
; la concurrence au lieu d'être pré-allouée. C'est exactement la courbe que la
; thèse FinOps prétend coûteuse — il faut la laisser s'exprimer pour la mesurer.
; (`pm = static` gonflerait la mémoire au repos et masquerait la pente ;
; le défaut de l'image, 5 enfants, saturerait le monolithe à 5 requêtes.)
[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 64
pm.process_idle_timeout = 10s
pm.max_requests = 0

; PHP-FPM VIDE l'environnement des enfants par défaut (`clear_env = yes`).
; Sans cette ligne, DB_HOST & co définis par docker-compose n'atteignent jamais
; PHP : Symfony résout alors des variables absentes et échoue au démarrage, ou
; pire, se rabat sur des valeurs par défaut et interroge une base qui n'est pas
; celle du banc. Le symptôme est distant de la cause, d'où cette note.
clear_env = no

php_admin_value[memory_limit] = 256M
catch_workers_output = yes
