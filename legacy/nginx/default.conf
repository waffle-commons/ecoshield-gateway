# Le tier legacy classique : Nginx en frontal, PHP-FPM derrière, un process par
# requête concurrente. C'est cette architecture dont EcoShield cherche à réduire
# le coût — sans la réécrire.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Résolution DNS À L'EXÉCUTION, et non au chargement de la configuration.
    #
    # Avec un nom d'hôte écrit directement dans `fastcgi_pass`, Nginx résout
    # `legacy-fpm` UNE FOIS au démarrage et garde l'adresse. Dès que le conteneur
    # FPM est recréé — ce que fait toute reconstruction d'image — il obtient une
    # nouvelle IP, et Nginx continue d'appeler l'ancienne : « connect() failed
    # (111: Connection refused) », 502 sur TOUTES les routes, sans que rien n'ait
    # changé côté application. Le piège a coûté un diagnostic complet ici, et il
    # tomberait au milieu d'une campagne de mesure sans prévenir.
    #
    # Passer par une variable force Nginx à interroger le résolveur intégré de
    # Docker (127.0.0.11) à chaque requête, avec un TTL court.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_upstream legacy-fpm:9000;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $fpm_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
