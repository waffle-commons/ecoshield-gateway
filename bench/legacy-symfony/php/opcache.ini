; Réglages opcache du monolithe Symfony.
;
; Rigoureusement IDENTIQUES à ceux de la passerelle
; (`docker/frankenphp/conf.d/app.ini`) : mêmes valeurs, même absence de JIT. Un
; banc qui donnerait l'opcache à un camp et pas à l'autre ne comparerait pas deux
; architectures, il comparerait un réglage.
;
; Le point mérite d'être souligné, parce que c'est la faiblesse principale du
; monolithe de démonstration précédent : l'image `php:8.3-fpm-alpine` n'active
; PAS opcache par défaut, si bien que le legacy RECOMPILAIT chaque fichier PHP à
; chaque requête. L'écart mesuré incluait donc un handicap qu'aucun exploitant
; n'accepterait en production, et le chiffre était injuste envers le legacy.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
