# Nginx devant le monolithe Symfony — API seule, donc AUCUN fichier statique.
#
# La configuration du stand-in utilise `try_files $uri /index.php` : Nginx doit
# alors VOIR l'arbre de fichiers pour décider, ce qui obligerait à partager
# `public/` entre les deux conteneurs. C'est faisable avec un volume nommé, et
# c'est un piège : un volume nommé n'est peuplé que lorsqu'il est VIDE, si bien
# qu'après une reconstruction de l'image, Nginx continuerait à servir l'ancienne
# application sans que rien ne le signale. Un banc qui mesure silencieusement
# une version périmée est pire qu'un banc cassé.
#
# Le monolithe n'expose que du JSON : toutes les requêtes vont au contrôleur
# frontal, `try_files` n'a rien à décider, et Nginx n'a plus besoin d'accéder au
# moindre fichier. Le partage disparaît, et le piège avec lui.
server {
    listen 80;
    server_name _;

    # `root` n'est ici que pour la forme : rien n'est lu depuis ce chemin côté
    # Nginx. Les chemins réels sont passés explicitement à FPM ci-dessous.
    root /var/www/html/public;

    # Résolution DNS À L'EXÉCUTION, et non au chargement de la configuration.
    #
    # Avec un nom d'hôte écrit directement dans `fastcgi_pass`, Nginx résout
    # `legacy-fpm` UNE FOIS au démarrage et garde l'adresse. Dès que le conteneur
    # FPM est recréé — ce que fait toute reconstruction d'image — il obtient une
    # nouvelle IP, et Nginx continue d'appeler l'ancienne : « connect() failed
    # (111: Connection refused) », 502 sur TOUTES les routes, sans que rien n'ait
    # changé côté application. Le piège a coûté un diagnostic complet ici, et il
    # tomberait au milieu d'une campagne de mesure sans prévenir.
    #
    # Passer par une variable force Nginx à interroger le résolveur intégré de
    # Docker (127.0.0.11) à chaque requête, avec un TTL court.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_upstream legacy-fpm:9000;

    location / {
        fastcgi_pass $fpm_upstream;
        include fastcgi_params;

        # Chemins fixés en dur : c'est le corollaire de « aucun accès disque ».
        # Nginx ne peut pas dériver SCRIPT_FILENAME d'un fichier qu'il ne voit
        # pas, et le contrôleur frontal est de toute façon le seul point d'entrée.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
    }
}
