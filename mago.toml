# Mago Configuration - EcoShield Gateway (POC application on Waffle Commons)
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.5.5"

[source]
paths = ["src/", "tests/"]
includes = ["vendor"]
excludes = []

# -----------------------------------------------------------------------------
# Mago Guard — Beta 0 standardized architectural perimeter
# -----------------------------------------------------------------------------
# By default a new component depends only on `waffle-commons/contracts`. Edit
# the `permit` list below if your component legitimately requires another
# waffle-commons package (and declare the dependency in composer.json).
[guard]
mode = "default"
# Mock-bootstrap files declare the production namespace to override built-in
# PHP functions via php-mock. They are intentionally cross-layer and excluded
# from guard analysis.
excludes = ["tests/bootstrap.php"]

[guard.perimeter]
layering = ["App", "AppTests"]

[guard.perimeter.layers]
core = ["@global", "Psl\\**"]
psr = ["Psr\\**"]
# This is an APPLICATION, not a framework component, so the contracts-only
# perimeter that governs waffle-commons packages does not apply: an app is
# precisely the place allowed to assemble concrete implementations. What the
# perimeter still enforces is that it assembles them through PUBLIC packages —
# the POC's whole thesis is that a real gateway needs no reach-through into
# component internals, so every namespace below is a published package.
waffle = ["Waffle\\Commons\\**", "Waffle\\Core\\**", "Waffle\\Event\\**", "Waffle\\Exception\\**", "Waffle\\Kernel"]

[[guard.perimeter.rules]]
namespace = "App"
permit = [
    "App\\**",
    "@layer:core",
    "@layer:psr",
    "@layer:waffle",
]

[[guard.perimeter.rules]]
namespace = "AppTests"
permit = ["@all"]

[[guard.structural.rules]]
on = "Waffle\\Commons\\**"
target = "interface"
must-be-named = "*Interface"
reason = "Interfaces must follow the waffle-commons *Interface convention."

[[guard.structural.rules]]
on = "Waffle\\Commons\\**\\Enum\\**"
must-be = ["enum"]
reason = "Reserved namespace: only enum declarations are permitted here."

[[guard.structural.rules]]
on = "Waffle\\Commons\\**\\Exception\\**"
target = "class"
must-be-named = "*Exception"
reason = "Exception classes must follow the *Exception naming convention."

[formatter]
print-width = 120
tab-width = 4
use-tabs = false
single-quote = true
trailing-comma = true
end-of-line = "lf"

[linter]
# Zero-Baseline policy (Beta 0): no `baseline = ...` is permitted.
integrations = ["phpunit"]

[linter.rules]
# Security - Zero tolerance
no-insecure-comparison = { level = "error" }
no-literal-password = { level = "error" }
no-debug-symbols = { level = "error" }
disallowed-functions = { level = "error", functions = ["eval", "exec", "system", "shell_exec", "passthru", "phpinfo"] }

# Code quality - Strict
prefer-interface = { level = "error" }
strict-types = { level = "error" }
no-ini-set = { enabled = false }

# >>> alpha6-opinionated-suppressions (generated)
literal-named-argument = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
single-class-per-file = { enabled = false }
no-else-clause = { enabled = false }
block-statement = { enabled = false }
assertion-style = { enabled = false }
assert-description = { enabled = false }
tagged-todo = { enabled = false }
cyclomatic-complexity = { enabled = true, threshold = 50 }
too-many-methods = { enabled = false }
kan-defect = { enabled = false }
halstead = { enabled = false }
prefer-arrow-function = { enabled = false }
no-redundant-nullsafe = { enabled = false }
excessive-parameter-list = { enabled = false }
# <<< alpha6-opinionated-suppressions

[analyzer]
# Zero-Baseline policy (Beta 0): no `baseline = ...` is permitted.
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
strict-list-index-checks = true
strict-array-index-existence = true
ignore = [
    # Frontière de désérialisation du Shield. `CacheInterface::get()` rend
    # `mixed` par contrat — c'est vrai de tout cache PSR-16 — et le seul moyen
    # de le refuser serait de ne pas lire le cache. La valeur est intégralement
    # re-vérifiée sur place (`is_int` / `is_array` / `is_string` par champ, puis
    # filtrage des valeurs d'en-têtes) avant de reconstruire quoi que ce soit :
    # une entrée mal formée se solde par un miss. Portée à ce seul fichier.
    { code = "mixed-assignment", in = ["src/Shield/ResponseCache.php"] },
    # (kept from the reference config; unused here but harmless)
    # cURL options are int constants → mixed-typed array values in test capture; iteration vars
    # and intermediate Closure extraction are `mixed` by necessity.
    { code = "mixed-assignment", in = ["tests/"] },
    { code = "mixed-argument", in = ["tests/"] },
    { code = "mixed-operand", in = ["tests/"] },
    # Captured cURL options are populated by the mock at request time; Mago can't prove key
    # presence across mock-callback boundaries even though every test pre-populates them.
    { code = "possibly-undefined-int-array-index", in = ["tests/"] },
    # `PHPUnit\Framework\TestCase::any` is the legacy invocation-matcher; phpunit 12 marks it as
    # deprecated but offers no drop-in replacement that's compatible with php-mock-phpunit.
    { code = "deprecated-method", in = ["tests/"] },
]
