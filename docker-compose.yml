# EcoShield Gateway — la démonstration complète en une commande.
#
# Trois rôles, qui sont exactement les trois de l'architecture décrite dans le
# README : la passerelle en mode worker, le monolithe legacy qu'elle protège
# (Nginx + PHP-FPM, un bootstrap par requête), et le cache partagé.
#
# Ce fichier est le défaut, et le défaut est PRODUCTION : image `prod` (code
# copié, opcache figé, préchargement), debug désactivé, et seule la passerelle
# publie un port. La première commande que lance un lecteur du README doit
# démarrer ce qui est réellement déployé — pas un mode développement dont les
# traces d'erreur et les performances ne ressemblent à rien de livrable.
#
#   développement : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   mesure        : docker compose -f docker-compose.yml -f docker-compose.bench.yml up -d --build
services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    container_name: ecoshield-gateway
    environment:
      APP_ENV: prod
      APP_DEBUG: 'false'
      SERVER_NAME: ':80'
      # La destination est fixée ici, par l'exploitant. Aucun client ne peut la
      # changer : la passerelle ne reprend du message entrant que chemin + query.
      UPSTREAM_URL: 'http://legacy-nginx:80'
      CACHE_ADAPTER: 'redis'
      REDIS_DSN: 'redis://redis:6379'
      # Nombre de requêtes servies avant recyclage du worker. Le laisser élevé
      # est le point : un worker qui se recycle rarement est un worker dont le
      # framework reste chaud.
      MAX_REQUESTS: '2000'
      # Nombre de workers résidents. C'est LA variable à déclarer explicitement
      # dans un banc FinOps : comparer 4 workers à 64 enfants PHP-FPM ne mesure
      # pas deux architectures, cela mesure deux dimensionnements. On l'aligne
      # donc sur la capacité du monolithe pour que la latence redevienne
      # comparable — la mémoire, elle, reste le résultat intéressant, puisque la
      # passerelle tient cette concurrence sans que son empreinte suive.
      WORKER_COUNT: '${WORKER_COUNT:-16}'
    ports:
      - '${GATEWAY_PORT:-8099}:80'
    depends_on:
      - legacy-nginx
      - redis
    # La sonde interroge la passerelle SEULE : elle ne doit pas se déclarer
    # malade parce que le monolithe est tombé, sans quoi l'orchestrateur
    # redémarrerait le seul composant encore capable de servir du cache.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-H', 'Host: localhost', 'http://127.0.0.1/__ecoshield/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  legacy-nginx:
    image: nginx:1.27-alpine
    container_name: ecoshield-legacy-nginx
    # Aucun port publié : le monolithe n'est joignable QUE par la passerelle.
    # C'est tout l'intérêt du bouclier — un amont accessible en direct se
    # contourne, et la passerelle ne protège plus rien. Le banc le publie
    # temporairement (docker-compose.bench.yml) parce qu'une mesure a besoin
    # d'un chemin de référence ; un déploiement ne le fait jamais.
    volumes:
      - ./legacy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./legacy/public:/var/www/html/public:ro
    depends_on:
      - legacy-fpm

  legacy-fpm:
    image: php:8.3-fpm-alpine
    container_name: ecoshield-legacy-fpm
    volumes:
      - ./legacy/public:/var/www/html/public:ro
      # Sans ce pool, l'image plafonne à 5 enfants : le monolithe ne peut pas
      # atteindre la concurrence mesurée, et sa courbe mémoire — le sujet même du
      # benchmark — ne peut pas s'exprimer.
      - ./legacy/php-fpm/www.conf:/usr/local/etc/php-fpm.d/zz-bench.conf:ro
    # Mémoire volontairement plafonnée : c'est la ressource que la comparaison
    # mesure, et la laisser illimitée rendrait le résultat ininterprétable.
    environment:
      PHP_MEMORY_LIMIT: '256M'

  redis:
    image: redis:7-alpine
    container_name: ecoshield-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
