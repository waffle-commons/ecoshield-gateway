# Surcharge : le monolithe legacy devient un VRAI Symfony.
#
# À composer APRÈS docker-compose.perf.yml, dont elle conserve toutes les bornes
# CPU et mémoire :
#
#   bench/legacy-symfony/bootstrap.sh
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml \
#                  -f docker-compose.symfony.yml up -d --build
#
# Ce que cette surcharge change, et RIEN D'AUTRE : l'application servie par
# PHP-FPM. Même PHP 8.3, même image de base alpine, même pool `ondemand` à 64
# enfants, même plafond de 256 Mio, même opcache, mêmes bornes CPU. Une seule
# variable bouge — c'est ce qui rend le delta attribuable à l'architecture
# plutôt qu'au dimensionnement.
services:
  legacy-fpm:
    # L'image remplace le montage : le code est copié dedans et le cache prod y
    # est reconstruit. Monter les sources ferait revalider l'opcache à travers
    # virtiofs — `bench/BENCH-RESULT.md` a déjà payé une série entière à cette
    # erreur.
    image: !reset null
    build:
      context: .
      dockerfile: bench/legacy-symfony/Dockerfile
      args:
        PHP_VERSION: '8.3'
    # Les montages du stand-in n'ont plus lieu d'être : `www.conf` est copié dans
    # l'image, et `legacy/public/` n'appartient pas à ce déploiement.
    volumes: !reset []
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'

  legacy-nginx:
    # Configuration API-seule : toutes les requêtes vont au contrôleur frontal,
    # Nginx ne lit aucun fichier, et les deux conteneurs n'ont donc RIEN à
    # partager. Voir l'en-tête du fichier pour le piège que cela évite.
    volumes:
      - ./bench/legacy-symfony/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
